name: Internal - Common Continuous Integration tasks
on:
  workflow_call: null
permissions: {}
jobs:
  lint:
    name: linter
    uses: hoverkraft-tech/ci-github-common/.github/workflows/linter.yml@d07ee49b460ae2f3815804b5153fe918092aa321 # 4.2.0
    permissions:
      contents: read
      statuses: write
      issues: write
      packages: read
      pull-requests: write
      actions: read
      security-events: write
    with:
      comment: false
      linter-env: |-
        VALIDATE_PHP_BUILTIN=false
        VALIDATE_PHP_PHPCS=false
        VALIDATE_PHP_PHPSTAN=false
        VALIDATE_PHP_PSALM=false
  test-workflow-continuous-integration:
    uses: $/.github/workflows/__test-workflow-continuous-integration.yml
    permissions:
      contents: read
      id-token: write
  test-action-get-php-versions:
    uses: $/.github/workflows/__test-action-get-php-versions.yml
    permissions:
      contents: read
      id-token: write
      packages: read
      pull-requests: write
      security-events: write
  test-action-setup-php:
    uses: $/.github/workflows/__test-action-setup-php.yml
    permissions:
      contents: read
  test-action-package-test:
    uses: $/.github/workflows/__test-action-package-test.yml
    permissions:
      contents: read
  test-workflow-release:
    uses: $/.github/workflows/__test-workflow-release.yml
    permissions:
      contents: read
  test-action-test:
    strategy:
      fail-fast: false
      matrix:
        scenario:
          [
            reports,
            publication-disabled,
            preparation,
            composer-command,
            failing-command,
            failing-tests,
            no-reports,
          ]
    uses: $/.github/workflows/__test-action-test.yml
    with:
      scenario: ${{ matrix.scenario }}
    permissions:
      contents: read
      pull-requests: write
  test-action-lint:
    strategy:
      fail-fast: false
      matrix:
        scenario: [success, failure, no-reports]
    uses: $/.github/workflows/__test-action-lint.yml
    with:
      scenario: ${{ matrix.scenario }}
    permissions:
      contents: read
      pull-requests: write
  test-workflow-documentation:
    uses: $/.github/workflows/__test-workflow-documentation.yml
    permissions:
      contents: read
  test-bundled-actions:
    uses: hoverkraft-tech/ci-github-common/.github/workflows/test-action-distributions.yml@d07ee49b460ae2f3815804b5153fe918092aa321 # 4.2.0
    permissions:
      contents: read
  reports:
    needs: [lint, test-action-get-php-versions]
    if: always()
    uses: hoverkraft-tech/ci-github-common/.github/workflows/ci-reports.yml@d07ee49b460ae2f3815804b5153fe918092aa321 # 4.2.0
    permissions:
      contents: read
      pull-requests: write
    with:
      job-results: ${{ toJSON(needs) }}

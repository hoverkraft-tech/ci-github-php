name: Internal - Common Continuous Integration tasks
on:
  workflow_call: null
permissions: {}
jobs:
  linter:
    uses: hoverkraft-tech/ci-github-common/.github/workflows/linter.yml@90211d735aa0289702ddbd7eb95b218020ccadad # 2.0.2
    permissions:
      contents: read
      statuses: write
      issues: write
      packages: read
      pull-requests: write
      actions: read
      security-events: write
    with:
      linter-env: |-
        VALIDATE_PHP_BUILTIN=false
        VALIDATE_PHP_PHPCS=false
        VALIDATE_PHP_PHPSTAN=false
        VALIDATE_PHP_PSALM=false
  test-workflow-continuous-integration:
    uses: $/.github/workflows/__test-workflow-continuous-integration.yml
    permissions:
      contents: read
      id-token: write
  test-action-setup-php:
    uses: $/.github/workflows/__test-action-setup-php.yml
    permissions:
      contents: read
  test-action-package-test:
    uses: $/.github/workflows/__test-action-package-test.yml
    permissions:
      contents: read
  test-workflow-release:
    uses: $/.github/workflows/__test-workflow-release.yml
    permissions:
      contents: read
  test-action-test:
    uses: $/.github/workflows/__test-action-test.yml
    permissions:
      contents: read
  test-workflow-documentation:
    uses: $/.github/workflows/__test-workflow-documentation.yml
    permissions:
      contents: read

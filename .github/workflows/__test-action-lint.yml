name: Internal - Test PHP lint action
on:
  workflow_call:
permissions: {}
jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        scenario: [success, failure, no-reports]
    steps:
      - name: Arrange - Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Arrange - Configure native PHPStan reports
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          SCENARIO: ${{ matrix.scenario }}
        with:
          script: |
            const fs = require('node:fs/promises');
            await io.cp('tests/php-project', '.test-php-lint', {recursive: true});
            const manifestPath = '.test-php-lint/composer.json';
            const manifest = JSON.parse(await fs.readFile(manifestPath, 'utf8'));
            if (process.env.SCENARIO !== 'no-reports') {
              manifest.scripts['lint:ci'] = 'tools/vendor/bin/phpstan analyse src --level=max --no-progress --error-format=checkstyle > phpstan-checkstyle.xml';
            }
            if (process.env.SCENARIO === 'failure') {
              const source = '.test-php-lint/src/Sample.php';
              await fs.writeFile(source, (await fs.readFile(source, 'utf8')).replace('sample(): string', 'sample(): int'));
            }
            await fs.writeFile(manifestPath, JSON.stringify(manifest, null, 2) + '\n');
            await fs.writeFile('.test-php-lint/.private-fixture', 'Must not be uploaded');
      - name: Arrange - Install the Composer fixture
        uses: $/actions/setup-php
        with:
          working-directory: .test-php-lint
          coverage: none
      - name: Act - Lint without comment permission
        id: lint
        continue-on-error: ${{ matrix.scenario == 'failure' }}
        uses: $/actions/lint
        with:
          working-directory: .test-php-lint
      - name: Assert - Download the native lint artifact
        if: steps.lint.outputs.report-artifact-id != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ steps.lint.outputs.report-artifact-id }}
          path: downloaded-reports
          merge-multiple: true
      - name: Assert - Preserve failures and upload only parsed reports
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          SCENARIO: ${{ matrix.scenario }}
          OUTCOME: ${{ steps.lint.outcome }}
          ARTIFACT_ID: ${{ steps.lint.outputs.report-artifact-id }}
        with:
          script: |
            const assert = require('node:assert/strict');
            const fs = require('node:fs');
            assert.equal(process.env.OUTCOME, process.env.SCENARIO === 'failure' ? 'failure' : 'success');
            if (process.env.SCENARIO === 'no-reports') {
              assert.equal(process.env.ARTIFACT_ID, '');
              return;
            }
            assert.match(process.env.ARTIFACT_ID, /^\d+$/);
            const files = await (await glob.create('downloaded-reports/**/*', {matchDirectories: false})).glob();
            assert.equal(files.length, 1);
            const report = fs.readFileSync(files[0], 'utf8');
            assert.equal(report, fs.readFileSync('.test-php-lint/phpstan-checkstyle.xml', 'utf8'));
            assert.match(report, /<checkstyle\b/);
            assert.equal(report.includes('<error'), process.env.SCENARIO === 'failure');

  individual-comment:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Arrange - Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Arrange - Install the Composer fixture
        uses: $/actions/setup-php
        with:
          working-directory: tests/php-project
          coverage: none
      - name: Arrange - Configure PHPStan report generation
        working-directory: tests/php-project
        run: composer config scripts.lint:ci 'tools/vendor/bin/phpstan analyse src --level=max --no-progress --error-format=checkstyle > phpstan-checkstyle.xml'
      - name: Act - Publish an individual lint report
        uses: $/actions/lint
        with:
          working-directory: tests/php-project
          comment: "true"
      - name: Assert - One lint comment with collapsed details
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const assert = require('node:assert/strict');
            const pr = context.payload.pull_request;
            if (context.eventName !== 'pull_request' || pr.head.repo.full_name !== `${context.repo.owner}/${context.repo.repo}`) return;
            const comments = await github.paginate(github.rest.issues.listComments, {...context.repo, issue_number: pr.number, per_page: 100});
            const reports = comments.filter(comment => comment.user.login === 'github-actions[bot]' && comment.body.startsWith('PHP lint results\n'));
            assert.equal(reports.length, 1);
            assert.match(reports[0].body, /<details>/);
            assert.match(reports[0].body, /0 errors/);

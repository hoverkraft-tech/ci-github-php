name: Internal - Test PHP lint action
on:
  workflow_call:
    inputs:
      scenario:
        description: Integration scenario to run.
        required: true
        type: string
permissions: {}
jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      report-artifact-id: ${{ steps.lint.outputs.report-artifact-id }}
      expected-reports: ${{ steps.assert.outputs.expected-reports }}
    steps:
      - name: Arrange - Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Arrange - Configure native PHPStan reports
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          SCENARIO: ${{ inputs.scenario }}
        with:
          script: |
            const fs = require('node:fs/promises');
            await io.cp('tests/php-project', '.test-php-lint', {recursive: true});
            const manifestPath = '.test-php-lint/composer.json';
            const manifest = JSON.parse(await fs.readFile(manifestPath, 'utf8'));
            if (process.env.SCENARIO === 'no-reports') {
              manifest.scripts['lint:ci'] = 'tools/vendor/bin/phpstan analyse src --level=max --no-progress --error-format=github';
            } else {
              manifest.scripts['lint:ci'] = 'tools/vendor/bin/phpstan analyse src --level=max --no-progress --error-format=checkstyle > phpstan-checkstyle.xml';
            }
            if (process.env.SCENARIO === 'failure') {
              const source = '.test-php-lint/src/Sample.php';
              await fs.writeFile(source, (await fs.readFile(source, 'utf8')).replace('sample(): string', 'sample(): int'));
            }
            await fs.writeFile(manifestPath, JSON.stringify(manifest, null, 2) + '\n');
            await fs.writeFile('.test-php-lint/.private-fixture', 'Must not be uploaded');
      - name: Arrange - Install the Composer fixture
        uses: $/actions/setup-php
        with:
          working-directory: .test-php-lint
          coverage: none
      - name: Act - Lint without comment permission
        id: lint
        # The assertion below checks the exact expected outcome for every scenario.
        continue-on-error: true
        uses: $/actions/lint
        with:
          working-directory: .test-php-lint
      - name: Assert - Preserve failures and identify the native report
        id: assert
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          SCENARIO: ${{ inputs.scenario }}
          OUTCOME: ${{ steps.lint.outcome }}
          ARTIFACT_ID: ${{ steps.lint.outputs.report-artifact-id }}
        with:
          script: |
            const assert = require('node:assert/strict');
            const fs = require('node:fs');
            assert.equal(process.env.OUTCOME, ['failure','no-reports'].includes(process.env.SCENARIO) ? 'failure' : 'success');
            if (process.env.SCENARIO === 'no-reports') {
              assert.match(process.env.ARTIFACT_ID, /^\d+$/);
              core.setOutput('expected-reports',{});
              return;
            }
            assert.match(process.env.ARTIFACT_ID, /^\d+$/);
            const {createHash} = require('node:crypto');
            const report = fs.readFileSync('.test-php-lint/phpstan-checkstyle.xml', 'utf8');
            core.setOutput('expected-reports', {'phpstan-checkstyle.xml': createHash('sha256').update(report).digest('hex')});
            assert.match(report, /<checkstyle\b/);
            assert.equal(report.includes('<error'), process.env.SCENARIO === 'failure');

  verify-reports:
    needs: lint
    if: needs.lint.outputs.report-artifact-id != ''
    uses: $/.github/workflows/__assert-report-artifact.yml
    with:
      artifact-id: ${{ needs.lint.outputs.report-artifact-id }}
      expected-reports: ${{ needs.lint.outputs.expected-reports }}

    branches: [main]

permissions: {}

jobs:
  distributions:
    uses: hoverkraft-tech/ci-github-common/.github/workflows/action-distributions.yml@d07ee49b460ae2f3815804b5153fe918092aa321 # 4.2.0
    permissions:
      actions: read
      contents: read
      pull-requests: read
    with:
      pull-request-authors: |
        ["dependabot", "renovate", {"login":"hoverkraft-bot[bot]","id":128996893,"branch-prefix":"renovate/"}]

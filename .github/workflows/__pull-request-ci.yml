name: Internal - Pull request - Continuous Integration
on:
  merge_group: null
  pull_request:
    branches:
      - main
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ci:
    uses: $/.github/workflows/__shared-ci.yml
    permissions:
      actions: read
      contents: read
      id-token: write
      security-events: write
      statuses: write
      issues: write
      packages: read
      pull-requests: write

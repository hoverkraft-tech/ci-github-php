name: Greetings

on:
  issues:
    types: [opened]
  pull_request:
    types: [opened]
    branches: [main]

permissions: {}

jobs:
  greetings:
    if: ${{ github.event_name == 'issues' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]') }}
    uses: hoverkraft-tech/ci-github-common/.github/workflows/greetings.yml@f44e1bcc350b6bfe9e4a86a27b1d5e032e58f292 # 4.2.1
    permissions:
      contents: read
      issues: write
      pull-requests: write

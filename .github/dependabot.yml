version: 2
updates:
  - package-ecosystem: docker
    commit-message:
      prefix: build
      include: scope
    open-pull-requests-limit: 20
    directory: /
    schedule:
      interval: weekly
      day: friday
      time: "04:00"
    groups:
      docker-dependencies:
        patterns:
          - "*"
    cooldown:
      default-days: 7
  - package-ecosystem: github-actions
    commit-message:
      prefix: build
      include: scope
    open-pull-requests-limit: 20
    directories:
      - /
      - /actions/**/*
    schedule:
      interval: weekly
      day: friday
      time: "04:00"
    groups:
      github-actions-dependencies:
        patterns:
          - "*"
    cooldown:
      default-days: 7
  - package-ecosystem: composer
    commit-message:
      prefix: build
      include: scope
    open-pull-requests-limit: 20
    versioning-strategy: increase
    directories:
      - /tests/php-project
      - /tests/php-project/tools
    schedule:
      interval: weekly
      day: friday
      time: "04:00"
    groups:
      php-dependencies:
        patterns:
          - "*"
    cooldown:
      default-days: 7
  - package-ecosystem: devcontainers
    commit-message:
      prefix: build
      include: scope
    open-pull-requests-limit: 20
    directory: /
    schedule:
      interval: weekly
      day: friday
      time: "04:00"
    cooldown:
      default-days: 7

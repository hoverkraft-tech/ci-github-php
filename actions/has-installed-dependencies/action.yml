name: "Has installed dependencies"
description: "Action to check if dependencies have been installed with Composer."
author: Hoverkraft
branding:
  icon: settings
  color: gray-dark

inputs:
  dependencies:
    description: "The dependencies to check."
    required: true
  working-directory:
    description: |
      Working directory where the dependencies are installed.
      Can be absolute or relative to the repository root.
    required: false
    default: "."

outputs:
  installed-dependencies:
    description: "A map of dependencies and the status whether they have been installed or not."
    value: ${{ steps.has-dependencies.outputs.installed-dependencies }}

runs:
  using: "composite"
  steps:
    - shell: bash
      # FIXME: workaround until will be merged: https://github.com/actions/runner/pull/1684
      run: mkdir -p ./self-actions/ && cp -r $GITHUB_ACTION_PATH/../* ./self-actions/

    - id: get-package-manager
      uses: ./self-actions/get-package-manager
      with:
        working-directory: ${{ inputs.working-directory }}

    - shell: bash
      # FIXME: workaround until will be merged: https://github.com/actions/runner/pull/1684
      run: |
        rm -fr ./self-actions

    - id: has-dependencies
      uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
      env:
        WORKING_DIRECTORY: ${{ inputs.working-directory }}
      with:
        # jscpd:ignore-start
        script: |
          const fs = require('node:fs');
          const path = require('node:path');

          let workingDirectory = process.env.WORKING_DIRECTORY || '.';
          if (!path.isAbsolute(workingDirectory)) {
            workingDirectory = path.join(process.env.GITHUB_WORKSPACE, workingDirectory);
          }

          if (!fs.existsSync(workingDirectory)) {
            core.setFailed(`The specified working directory does not exist: ${workingDirectory}`);
            return;
          }

          workingDirectory = path.resolve(workingDirectory);
          core.debug(`Running in working directory: ${workingDirectory}`);
          process.chdir(workingDirectory);

          const dependenciesPatterns = {
            phpunit: /phpunit\/phpunit/,
            phpstan: /phpstan\/phpstan/,
            'psalm': /vimeo\/psalm/,
            'php-cs-fixer': /friendsofphp\/php-cs-fixer/,
          };

          const dependencies = `${{ inputs.dependencies }}`.split('\n').map(x => x.trim()).filter(x => x !== '');

          const hasDependencies = Object.fromEntries(dependencies.map(dependency => [dependency, false]));

          const setHasDependencies = (dependency) => {
            for (const dependencyName of Object.keys(hasDependencies)) {
              if (hasDependencies[dependencyName]) {
                continue;
              }

              if (dependencyName === dependency) {
                hasDependencies[dependencyName] = true;
                continue;
              }

              if (dependenciesPatterns[dependencyName] && dependenciesPatterns[dependencyName].test(dependency)) {
                hasDependencies[dependencyName] = true;
                continue;
              }
            }
          };

          const parseComposerDependencies = (dependencies) => {
            for (const dependencyName of Object.keys(dependencies)) {
              setHasDependencies(dependencyName);

              if (Object.values(hasDependencies).every(Boolean)) {
                break;
              }
            }
          };

          const parseDependencies = async () => {
            const { stdout } = await exec.getExecOutput(
              'composer show --locked --format=json',
              undefined,
              { cwd: workingDirectory }
            );

            if (stdout === '') {
              return;
            }

            const allInstalledDependencies = JSON.parse(stdout);
            return allInstalledDependencies;
          }

          try {
            const composerInfo = await parseDependencies();
            
            if (composerInfo && composerInfo.locked) {
              const allDeps = {};
              for (const dep of composerInfo.locked) {
                allDeps[dep.name] = dep;
              }
              parseComposerDependencies(allDeps);
            }
          } catch (error) {
            core.warning(`Failed to parse dependencies: ${error.message}`);
          }

          core.setOutput('installed-dependencies', hasDependencies);
        # jscpd:ignore-end

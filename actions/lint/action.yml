name: Lint PHP
description: |
  Run project lint commands and retain native reports for consolidated CI feedback.
  The common ci-reports workflow owns comments and external coverage publication.
  Forward report-plan from standalone jobs; reusable workflows do this automatically.
  Required reports remain required after command failures. This action keeps local
  diagnostics and never grants publication permissions to project code.

  Generate supported lint reports such as SARIF, ESLint JSON or Checkstyle XML.
author: hoverkraft
branding:
  icon: package
  color: blue
inputs:
  working-directory:
    description: Composer project directory. Run setup-php first to install its dependencies.
    default: .
  command:
    description: |
      Composer script to execute, normally `lint:ci` in composer.json.
      Define the tools and their configuration in that script. Examples:

      - PHPStan: `phpstan analyse --error-format=checkstyle > phpstan-checkstyle.xml`
      - Psalm: `psalm --output-format=checkstyle > psalm-checkstyle.xml`
      - PHP_CodeSniffer: `phpcs --report=checkstyle --report-file=phpcs-checkstyle.xml`
      - PHP CS Fixer: `php-cs-fixer check --format=checkstyle > php-cs-fixer-checkstyle.xml`

      Redirecting output preserves the tool's exit status. The action discovers
      Checkstyle reports for annotations and summaries. Use paths relative to the project;
      for separate tooling installations, prefix binaries with `tools/vendor/bin/`.
      See the [CI guide](../../.github/workflows/continuous-integration.md).
    default: lint:ci
  report-plan:
    description: Expected producer metadata supplied by reusable workflows. Leave empty for standalone use.
    default: ""
outputs:
  report-artifact-id:
    description: Native report bundle, including available diagnostics after failures.
    value: ${{ steps.reports.outputs.artifact-id }}
  report-plan:
    description: Expected report metadata. Forward from standalone jobs.
    value: ${{ steps.report-plan.outputs.report-plan }}
runs:
  using: composite
  steps:
    - id: directory
      uses: hoverkraft-tech/ci-github-common/actions/working-directory@d606f77fad305ef07dfde3db5270f5e324019c97 # 4.2.4
      with:
        working-directory: ${{ inputs.working-directory }}
    - id: report-plan
      uses: hoverkraft-tech/ci-github-common/actions/quality/record-ci-reports@11c842902d003cc4ee2fa1d42f6d80bc6828461a # unified reports (PR #683, unreleased)
      with:
        operation: plan
        report-plan: ${{ inputs.report-plan }}
        producers: '[{"key":"lint","type":"lint","directory":${{ toJSON(steps.directory.outputs.workspace-relative-path || ''.'') }},"coverage":[]}]'
    - id: run
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        WORKING_DIRECTORY: ${{ steps.directory.outputs.absolute-path }}
        COMMAND: ${{ inputs.command }}
      with:
        script: |-
          const command = process.env.COMMAND.trim();
          if (!command || command.startsWith('-')) throw new Error('command must name a Composer script.');
          await exec.exec('composer', ['--no-interaction', 'run-script', '--timeout=0', command], {
            cwd: process.env.WORKING_DIRECTORY,
          });
    - id: reports
      name: Record lint results
      if: ${{ !cancelled() && steps.report-plan.outcome == 'success' }}
      uses: hoverkraft-tech/ci-github-common/actions/quality/record-ci-reports@11c842902d003cc4ee2fa1d42f6d80bc6828461a # unified reports (PR #683, unreleased)
      with:
        working-directory: ${{ steps.directory.outputs.absolute-path }}
        report-plan: ${{ steps.report-plan.outputs.report-plan }}
        report-paths: auto:lint

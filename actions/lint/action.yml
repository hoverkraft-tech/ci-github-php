name: Lint PHP
description: |
  Run a project-defined Composer lint script and report results.

  Native lint reports are retained for seven days, including after command
  failures. Only parsed report files are uploaded. Keep `comment: false` and
  call the common `ci-reports` workflow after producer jobs for consolidated
  comments with collapsed details.
author: hoverkraft
branding:
  icon: package
  color: blue
inputs:
  working-directory:
    description: Composer project directory. Run setup-php first to install its dependencies.
    default: .
  command:
    description: |
      Composer script to execute, normally `lint:ci` in composer.json.
      Define the tools and their configuration in that script. Examples:

      - PHPStan: `phpstan analyse --error-format=checkstyle > phpstan-checkstyle.xml`
      - Psalm: `psalm --output-format=checkstyle > psalm-checkstyle.xml`
      - PHP_CodeSniffer: `phpcs --report=checkstyle --report-file=phpcs-checkstyle.xml`
      - PHP CS Fixer: `php-cs-fixer check --format=checkstyle > php-cs-fixer-checkstyle.xml`

      Redirecting output preserves the tool's exit status. The action discovers
      Checkstyle reports for annotations and summaries. Use paths relative to the project;
      for separate tooling installations, prefix binaries with `tools/vendor/bin/`.
      See the [CI guide](../../.github/workflows/continuous-integration.md).
    default: lint:ci
  comment:
    description: Publish an individual lint PR comment. Requires pull-requests write permission. Fork comments are disabled. Leave false for consolidated reporting; annotations, summaries and artifacts remain enabled.
    default: "false"
outputs:
  report-artifact-id:
    description: Native lint report artifact ID, empty when no supported reports were parsed.
    value: ${{ steps.upload-reports.outputs.artifact-id }}
runs:
  using: composite
  steps:
    - id: directory
      uses: hoverkraft-tech/ci-github-common/actions/working-directory@d07ee49b460ae2f3815804b5153fe918092aa321 # 4.2.0
      with:
        working-directory: ${{ inputs.working-directory }}
    - id: run
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        WORKING_DIRECTORY: ${{ steps.directory.outputs.absolute-path }}
        COMMAND: ${{ inputs.command }}
      with:
        script: |-
          const command = process.env.COMMAND.trim();
          if (!command || command.startsWith('-')) throw new Error('command must name a Composer script.');
          await exec.exec('composer', ['--no-interaction', 'run-script', '--timeout=0', command], {
            cwd: process.env.WORKING_DIRECTORY,
          });
    - name: Report lint results
      id: reports
      if: ${{ !cancelled() && steps.directory.outcome == 'success' }}
      uses: hoverkraft-tech/ci-github-common/actions/quality/parse-ci-reports@d07ee49b460ae2f3815804b5153fe918092aa321 # 4.2.0
      with:
        working-directory: ${{ steps.directory.outputs.absolute-path }}
        report-paths: auto:lint
        report-name: PHP lint
        output-format: annotations,summary,markdown
    - name: Publish individual report comment
      if: ${{ !cancelled() && inputs.comment == 'true' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && steps.reports.outputs.lint-markdown != '' }}
      uses: hoverkraft-tech/ci-github-common/actions/create-or-update-comment@d07ee49b460ae2f3815804b5153fe918092aa321 # 4.2.0
      with:
        title: PHP lint results
        body: ${{ steps.reports.outputs.lint-markdown }}
    - name: Prepare native report artifact
      id: report-artifact
      if: ${{ !cancelled() && steps.reports.outputs.parsed-files != '' }}
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        REPORT_FILES: ${{ steps.reports.outputs.parsed-files }}
      with:
        script: |
          core.setOutput('files', JSON.parse(process.env.REPORT_FILES).join('\n'));
          core.setOutput('id', require('node:crypto').randomUUID());
    - name: Upload native lint reports
      id: upload-reports
      if: ${{ !cancelled() && steps.report-artifact.outputs.files != '' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ci-reports-${{ github.run_attempt }}-${{ github.job }}-${{ steps.report-artifact.outputs.id }}
        path: ${{ steps.report-artifact.outputs.files }}
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 7

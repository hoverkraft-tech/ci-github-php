name: Test PHP
description: |
  Run project test commands and retain native reports for consolidated CI feedback.
  The common ci-reports workflow owns comments and external coverage publication.
  Forward report-plan from standalone jobs; reusable workflows do this automatically.
  Required reports remain required after command failures. This action keeps local
  diagnostics and never grants publication permissions to project code.

  Coverage publication requires Cobertura XML generated by the test tool. Configure
  JUnit or TAP for test results and merge framework shards before recording coverage.
author: hoverkraft
branding:
  icon: package
  color: blue
inputs:
  working-directory:
    description: Composer project directory. Run setup-php first to install its dependencies.
    default: .
  command:
    description: |
      Composer script to execute unchanged, normally `test:ci` in composer.json.
      The project defines its test tool, preparation and report generation. Examples:

      - PHPUnit: `phpunit --configuration phpunit.xml --log-junit=junit.xml --coverage-cobertura=cobertura.xml`
      - Pest: `pest --ci --log-junit=junit.xml --coverage-cobertura=cobertura.xml`

      Generate Cobertura for the consolidated publishing path. A Clover-only
      project must add Cobertura generation before enabling collection.
      Set coverage to false for diagnostic-only tests. Instrumentation and report
      generation remain controlled by the project command.
      See the [CI guide](../../.github/workflows/continuous-integration.md).
    default: test:ci
  coverage-reports:
    description: |-
      Optional JSON array of Cobertura file, language and label. Empty uses the language default; labels default to the project directory.
    default: ""
  coverage:
    description: Require Cobertura coverage for consolidated publication. Set false to retain available diagnostics without requiring Cobertura. Configure instrumentation in the test command.
    default: "true"
  report-plan:
    description: Expected producer metadata supplied by reusable workflows. Leave empty for standalone use.
    default: ""
outputs:
  report-artifact-id:
    description: Native report bundle, including available diagnostics after failures.
    value: ${{ steps.reports.outputs.artifact-id }}
  report-plan:
    description: Expected report metadata. Forward from standalone jobs.
    value: ${{ steps.report-plan.outputs.report-plan }}
runs:
  using: composite
  steps:
    - id: directory
      uses: hoverkraft-tech/ci-github-common/actions/working-directory@d606f77fad305ef07dfde3db5270f5e324019c97 # 4.2.4
      with:
        working-directory: ${{ inputs.working-directory }}
    - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        COVERAGE: ${{ inputs.coverage }}
      with:
        script: |
          if (!['true','false'].includes(process.env.COVERAGE)) throw new Error('coverage must be true or false.');
    - id: report-plan
      uses: hoverkraft-tech/ci-github-common/actions/quality/record-ci-reports@5ea25078a15fe361993382872c03a63fd667c11a # unified reports (PR #683, unreleased)
      with:
        operation: plan
        report-plan: ${{ inputs.report-plan }}
        producers: '[{"key":"test","type":"test","directory":${{ toJSON(steps.directory.outputs.workspace-relative-path || ''.'') }},"coverage":${{ inputs.coverage == ''true'' && (inputs.coverage-reports || ''[{"file":"cobertura.xml","language":"PHP"}]'') || ''[]'' }}}]'
    - id: run
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        WORKING_DIRECTORY: ${{ steps.directory.outputs.absolute-path }}
        COMMAND: ${{ inputs.command }}
      with:
        script: |-
          const command = process.env.COMMAND.trim();
          if (!command || command.startsWith('-')) throw new Error('command must name a Composer script.');
          const args = ['--no-interaction', 'run-script', '--timeout=0', command];
          await exec.exec('composer', args, {cwd: process.env.WORKING_DIRECTORY, env: {...process.env, CI: 'true'}});
    - id: reports
      name: Record test results
      if: ${{ !cancelled() && steps.report-plan.outcome == 'success' }}
      uses: hoverkraft-tech/ci-github-common/actions/quality/record-ci-reports@5ea25078a15fe361993382872c03a63fd667c11a # unified reports (PR #683, unreleased)
      with:
        working-directory: ${{ steps.directory.outputs.absolute-path }}
        report-plan: ${{ steps.report-plan.outputs.report-plan }}
        report-paths: auto:test
